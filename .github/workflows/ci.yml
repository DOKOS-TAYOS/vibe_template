name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Upgrade pip
        run: ./.venv/bin/python -m pip install --upgrade pip
        if: runner.os != 'Windows'

      - name: Upgrade pip on Windows
        run: .\.venv\Scripts\python.exe -m pip install --upgrade pip
        if: runner.os == 'Windows'

      - name: Install project
        run: ./.venv/bin/python -m pip install -e .[dev]
        if: runner.os != 'Windows'

      - name: Install project on Windows
        run: .\.venv\Scripts\python.exe -m pip install -e .[dev]
        if: runner.os == 'Windows'

      - name: Ruff check
        run: ./.venv/bin/python -m ruff check .
        if: runner.os != 'Windows'

      - name: Ruff check on Windows
        run: .\.venv\Scripts\python.exe -m ruff check .
        if: runner.os == 'Windows'

      - name: Ruff format check
        run: ./.venv/bin/python -m ruff format . --check
        if: runner.os != 'Windows'

      - name: Ruff format check on Windows
        run: .\.venv\Scripts\python.exe -m ruff format . --check
        if: runner.os == 'Windows'

      - name: Pytest
        run: ./.venv/bin/python -m pytest
        if: runner.os != 'Windows'

      - name: Pytest on Windows
        run: .\.venv\Scripts\python.exe -m pytest
        if: runner.os == 'Windows'

      - name: Pyright
        run: ./.venv/bin/python -m pyright
        if: runner.os != 'Windows'

      - name: Pyright on Windows
        run: .\.venv\Scripts\python.exe -m pyright
        if: runner.os == 'Windows'

  template-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Fresh template bootstrap smoke
        run: python scripts/bootstrap_smoke.py --workspace-root "${{ runner.temp }}/template-smoke"

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Skip dependency review outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Dependency review applies only to pull requests."

  required-pr-ci:
    name: required-pr-ci
    if: ${{ always() }}
    needs: [test, template-smoke, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TEMPLATE_SMOKE_RESULT: ${{ needs.template-smoke.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] ||
             [ "$TEMPLATE_SMOKE_RESULT" != "success" ] ||
             [ "$DEPENDENCY_REVIEW_RESULT" != "success" ]; then
            echo "test=$TEST_RESULT"
            echo "template-smoke=$TEMPLATE_SMOKE_RESULT"
            echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
